name: Bug 报告
description: 提交可复现的功能或兼容性问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除账号、密码、培训卡、Cookie、Token 和个人信息。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 例如 v8.10.0 或提交 SHA
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: 运行方式
      options:
        - Tampermonkey
        - Hermes
        - OpenClaw + Hermes
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定、已脱敏的复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Node 24 / Edge 150
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除账号、密码、培训卡、Cookie、Token 和个人信息
          required: true
