name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Locate Chrome
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"
          echo "HUAYI_BROWSER=$browser" >> "$GITHUB_ENV"

      - name: Test release source
        env:
          HUAYI_REQUIRE_BROWSER_SMOKE: "1"
        run: npm test

      - name: Build release files
        shell: bash
        run: |
          mkdir -p release
          cp src/tampermonkey/hua-yi-helper.user.js "release/hua-yi-helper-${GITHUB_REF_NAME}.user.js"
          git archive --format=zip --output="release/hua-yi-helper-${GITHUB_REF_NAME}-source.zip" "$GITHUB_SHA"
          (cd release && sha256sum hua-yi-helper-* > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --generate-notes \
            --title "华医网学习助手 $GITHUB_REF_NAME"
