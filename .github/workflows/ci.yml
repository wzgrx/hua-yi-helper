name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Locate Chrome on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"
          echo "HUAYI_BROWSER=$browser" >> "$GITHUB_ENV"

      - name: Locate Chrome on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:PROGRAMFILES\Google\Chrome\Application\chrome.exe",
            "${env:PROGRAMFILES(X86)}\Google\Chrome\Application\chrome.exe",
            "$env:PROGRAMFILES\Microsoft\Edge\Application\msedge.exe",
            "${env:PROGRAMFILES(X86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Chrome or Edge was not found on the runner' }
          "HUAYI_BROWSER=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Full suite with required browser smoke
        env:
          HUAYI_REQUIRE_BROWSER_SMOKE: '1'
        run: npm test

      - name: Verify generated source is committed
        run: git diff --exit-code

      - name: Dependency security audit
        if: runner.os == 'Linux' && matrix.node == 24
        run: npm run audit:security

      - name: Upload generated userscript
        if: runner.os == 'Linux' && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: hua-yi-helper-userscript
          path: src/tampermonkey/hua-yi-helper.user.js
          if-no-files-found: error
          retention-days: 30
